name: build-apk
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Projeyi aç
        run: echo '' | base64 -d | tar xz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK paketleri
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Derle
        run: gradle :app:assembleDebug --no-daemon
      - name: SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: winprobe-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk.sha256
