name: build-apk
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Projeyi aç
        run: echo '' | base64 -d | tar xz
      - name: Motor kaynağı (sabit commit + Android yaması)
        run: |
          git clone https://github.com/ammaarreshi/WindowsiOS app/src/main/cpp/engine
          git -C app/src/main/cpp/engine checkout 0071d6975287fd720b9046dfd3bd80b6f2aa765e
          git -C app/src/main/cpp/engine apply "$GITHUB_WORKSPACE/android-port.patch"
          git -C app/src/main/cpp/engine rev-parse HEAD
      - name: UEFI firmware (EDK2, açık kaynak, Ubuntu paketi)
        run: |
          sudo apt-get update -qq || true
          mkdir -p fw && cd fw
          apt-get download qemu-efi-aarch64
          dpkg-deb -x qemu-efi-aarch64_*.deb x
          cp x/usr/share/AAVMF/AAVMF_CODE.no-secboot.fd code.fd
          cp x/usr/share/AAVMF/AAVMF_VARS.fd vars.fd
          cp x/usr/share/doc/qemu-efi-aarch64/copyright COPYRIGHT.txt
          ls -l code.fd vars.fd
          sha256sum code.fd vars.fd
      - uses: actions/upload-artifact@v4
        with:
          name: uefi-firmware
          path: |
            fw/code.fd
            fw/vars.fd
            fw/COPYRIGHT.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK paketleri
        run: 'SDKM=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" -name sdkmanager | head -1); yes | "$SDKM" --licenses > /dev/null || true; "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"'
      - name: Derle
        run: gradle :app:assembleDebug --no-daemon
      - name: SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: winprobe-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk.sha256
